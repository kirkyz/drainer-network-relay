services:
  - type: web
    name: drainer-network-relay
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: python -m compileall -q server.py
    startCommand: python server.py
    healthCheckPath: /health
    envVars:
      - key: DRAINER_BIND
        value: 0.0.0.0
      - key: DRAINER_PORT
        value: 10000
